  <style>
    /* CRITICAL CONSTRAINT 1: No CSS 3D transforms on page/canvas container. Rock-solid motionless body. */
    :root {
      --bg-color: #eb0e09;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {

      overflow-x: hidden;

    /* Links and buttons retain cursor: none so custom cursor stays visible */

    /* Seamless full-screen canvas with zero 3D transforms */

    /* Subtle grain texture overlay for luxury editorial feel */

    }

    /* Frosted glass components */

      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
    }

    .glass-card {
      background: rgba(14, 2, 2, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

    /* ZERO-LAG HARDWARE-ACCELERATED CUSTOM MAGNETIC CURSOR */
    .cursor-dot {
      position: fixed;

<body>
  <div class="noise-overlay"></div>
  
  <!-- Hardware-Accelerated Custom Magnetic Cursor Elements -->
  <div id="cursor-dot" class="cursor-dot hidden md:block"></div>
  <div id="cursor-aura" class="cursor-aura hidden md:block"></div>

  <div id="root"></div>

  <!-- Main React Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Fast, shortest-path circular angular lerp
    // Responsive factor ~0.24 provides snappy, ultra-smooth ~35ms tracking with zero lag
    function lerpAngle(current, target, factor = 0.24) {
      let diff = (target - current) % (Math.PI * 2);
      diff = ((diff + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      let next = current + diff * factor;
      return ((next + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    }

    // Compass Direction angles in radians (0 = RIGHT, clockwise)
    const COMPASS_ANGLES = {
      'RIGHT': 0,
      'DOWN-RIGHT': Math.PI / 4,
      'DOWN': Math.PI / 2,
      'DOWN-LEFT': (3 * Math.PI) / 4,
      'LEFT': Math.PI,
      'UP-LEFT': -(3 * Math.PI) / 4,
      'UP': -Math.PI / 2,
      'UP-RIGHT': -Math.PI / 4,
    };

    // =========================================================================
    // 🔗 PERSONAL PROFILE & SOCIAL LINKS CONFIGURATION
    // =========================================================================
    const PERSONAL_LINKS = {
      // 👉 LINKEDIN PROFILE URL:
      linkedin: "https://www.linkedin.com/in/anup-luitel-0b062440a",
      
      // 👉 GITHUB PROFILE URL:
      github: "https://github.com/your-username-here",
      
      // 👉 YOUR EMAIL ADDRESS:
      email: "anuplui10@gmail.com",
      
      // 👉 X / TWITTER (optional):
      twitter: "https://twitter.com/your-username-here"
    };

    // Auto-normalizes URLs (e.g. handles "www.linkedin.com" -> "https://www.linkedin.com")
    const formatUrl = (url) => {
      if (!url) return '#';
      if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('mailto:')) return url;
      return `https://${url}`;
    };

    function App() {
      // High-level telemetry state (throttled to avoid React render lag)
      const [telemetry, setTelemetry] = useState({
        angleDeg: 0,
        direction: 'CENTER',
        frameIndex: 0,
        isEyeContact: true,
        fps: 60,
      });
      const [mode, setMode] = useState('tracking'); // 'tracking', 'orbit', 'compass'
      const [showHud, setShowHud] = useState(false);
      const [showResumeModal, setShowResumeModal] = useState(false);
      const [framesLoadedCount, setFramesLoadedCount] = useState(0);

      // Email interaction helpers
      const [copiedEmail, setCopiedEmail] = useState(false);
      const cleanEmail = (PERSONAL_LINKS.email || '').replace(/^mailto:/, '').trim();
      const gmailComposeUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(cleanEmail)}`;
      const mailtoUrl = `mailto:${cleanEmail}`;

      const handleCopyEmail = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(cleanEmail);
        }
        setCopiedEmail(true);
        setTimeout(() => setCopiedEmail(false), 2500);
      };

      // Animation & Canvas Refs (100% decoupled from React state renders)
      const canvasRef = useRef(null);
      const framesRef = useRef([]);
      const centerFrameRef = useRef(null);
      const lastRenderedImgRef = useRef(null);
      const lastDrawnFrameIndexRef = useRef(-1);
      const lastDrawnEyeContactRef = useRef(null);
      const currentAngleRef = useRef(0);
      const targetAngleRef = useRef(0);
      const isEyeContactRef = useRef(true);
      const orbitAngleRef = useRef(0);
      const animFrameIdRef = useRef(null);
      const showHudRef = useRef(showHud);

      // Decoupled Mouse State (updated in raw event listener, 0ms latency)
      const mouseRef = useRef({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        active: false,
        isHovering: false,
        isMouseDown: false,
      });
      const smoothMouseRef = useRef({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
      });
      const auraPosRef = useRef({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        scale: 1,
      });

      // Synchronize showHud to ref to avoid re-binding rAF loop on HUD toggle
      useEffect(() => {
        showHudRef.current = showHud;
      }, [showHud]);

      // Preload 64 WebP frames + center.webp
      useEffect(() => {
        let loaded = 0;
        const frames = [];

        // Center neutral frame (direct eye contact)
        const centerImg = new Image();
        centerImg.src = 'frames/center.webp';
        centerImg.onload = () => {
          loaded++;
          setFramesLoadedCount(loaded);
          if (!lastRenderedImgRef.current) {
            lastRenderedImgRef.current = centerImg;
          }
        };
        centerFrameRef.current = centerImg;

        // 64 circular trajectory frames
        for (let i = 0; i < 64; i++) {
          const img = new Image();
          img.src = `frames/${i}.webp`;
          img.onload = () => {
            loaded++;
            setFramesLoadedCount(loaded);
          };
          frames.push(img);
        }
        framesRef.current = frames;
      }, []);

      // ZERO-LAG HARDWARE-ACCELERATED CURSOR LISTENER
      useEffect(() => {
        const dotEl = document.getElementById('cursor-dot');
        const auraEl = document.getElementById('cursor-aura');

        const onMouseMove = (e) => {
          mouseRef.current.x = e.clientX;
          mouseRef.current.y = e.clientY;
          mouseRef.current.active = true;

          // Direct hardware-accelerated transform update with ZERO React re-render
          if (dotEl) {
            dotEl.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
            dotEl.style.opacity = '1';
          }
          if (auraEl && auraEl.style.opacity !== '1') {
            auraEl.style.opacity = '1';
          }

          if (mode === 'compass') {
            setMode('tracking');
          }
        };

        const onMouseDown = () => {
          mouseRef.current.isMouseDown = true;
        };

        const onMouseUp = () => {
          mouseRef.current.isMouseDown = false;
        };

        const onMouseOver = (e) => {
          const t = e.target;
          if (
            t.tagName === 'A' || 
            t.tagName === 'BUTTON' || 
            t.closest('a') || 
            t.closest('button') ||
            t.classList.contains('interactive-hover')
          ) {
            mouseRef.current.isHovering = true;
            if (auraEl) auraEl.classList.add('hovering');
          } else {
            mouseRef.current.isHovering = false;
            if (auraEl) auraEl.classList.remove('hovering');
          }
        };

        const onMouseLeave = () => {
          mouseRef.current.active = false;
          if (dotEl) dotEl.style.opacity = '0';
          if (auraEl) auraEl.style.opacity = '0';
        };

        const onMouseEnter = () => {
          mouseRef.current.active = true;
          if (dotEl) dotEl.style.opacity = '1';
          if (auraEl) auraEl.style.opacity = '1';
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        window.addEventListener('mousedown', onMouseDown, { passive: true });
        window.addEventListener('mouseup', onMouseUp, { passive: true });
        window.addEventListener('mouseover', onMouseOver, { passive: true });
        document.documentElement.addEventListener('mouseleave', onMouseLeave, { passive: true });
        document.documentElement.addEventListener('mouseenter', onMouseEnter, { passive: true });

        // Touch support
        const onTouchMove = (e) => {
          if (e.touches.length > 0) {
            mouseRef.current.x = e.touches[0].clientX;
            mouseRef.current.y = e.touches[0].clientY;
            mouseRef.current.active = true;
          }
        };
        window.addEventListener('touchmove', onTouchMove, { passive: true });

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mouseup', onMouseUp);
          window.removeEventListener('mouseover', onMouseOver);
          document.documentElement.removeEventListener('mouseleave', onMouseLeave);
          document.documentElement.removeEventListener('mouseenter', onMouseEnter);
          window.removeEventListener('touchmove', onTouchMove);
        };
      }, [mode]);

      // UNIFIED 60/120 FPS CANVAS & CURSOR RENDER LOOP
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { alpha: false });
        const auraEl = document.getElementById('cursor-aura');

        // Lock internal resolution to 1280x720 matching WebP frames 1:1
        canvas.width = 1280;
        canvas.height = 720;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        let frameCounter = 0;
        let lastFpsCheck = performance.now();
        let lastTelemetryPush = performance.now();
        let fps = 60;

        const renderLoop = (time) => {
          frameCounter++;
          if (time - lastFpsCheck >= 1000) {
            fps = Math.round((frameCounter * 1000) / (time - lastFpsCheck));
            frameCounter = 0;
            lastFpsCheck = time;
          }

          const mouse = mouseRef.current;

          // 1. UPDATE CURSOR AURA (Smooth magnetic lerp in GPU space)
          if (mouse.active && auraEl) {
            auraPosRef.current.x += (mouse.x - auraPosRef.current.x) * 0.22;
            auraPosRef.current.y += (mouse.y - auraPosRef.current.y) * 0.22;

            let targetScale = 1;
            if (mouse.isMouseDown) {
              targetScale = 0.82;
            } else if (mouse.isHovering) {
              targetScale = 1.75;
            }
            auraPosRef.current.scale += (targetScale - auraPosRef.current.scale) * 0.22;

            auraEl.style.transform = `translate3d(${auraPosRef.current.x}px, ${auraPosRef.current.y}px, 0) scale(${auraPosRef.current.scale})`;

            if (isEyeContactRef.current) {
              auraEl.classList.add('eye-contact');
            } else {
              auraEl.classList.remove('eye-contact');
            }
          }

          // 2. COMPUTE EXACT OBJECT-FIT: COVER GEOMETRY
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const viewportAspect = vw / vh;
          const videoAspect = 1280 / 720; // 16:9 ~ 1.7778

          let scale, offsetX, offsetY;
          if (viewportAspect > videoAspect) {
            // Viewport is wider than 16:9: scale to width, crop top/bottom
            scale = vw / 1280;
            offsetX = 0;
            offsetY = (vh - 720 * scale) / 2;
          } else {
            // Viewport is taller than 16:9: scale to height, crop sides
            scale = vh / 720;
            offsetX = (vw - 1280 * scale) / 2;
            offsetY = 0;
          }

          // Face center in 1280x720 video: X=640 (0.50), Y=200 (0.278)
          const rect = canvas.getBoundingClientRect();
          const faceScreenX = rect.left + offsetX + (1280 * 0.50) * scale;
          const faceScreenY = rect.top + offsetY + (720 * 0.278) * scale;

          // NATURAL EYE CONTACT DEADZONE
          // Sized directly to the character's eye/face region (~8% of screen dimension)
          const screenDim = Math.min(vw, vh);
          const deadzoneRadius = screenDim * 0.08;

          // Direct mouse delta for ZERO-LATENCY tracking (no double filtering lag)
          const dx = mouse.x - faceScreenX;
          const dy = mouse.y - faceScreenY;
          const dist = Math.hypot(dx, dy);

          let targetAngle = targetAngleRef.current;

          if (mode === 'orbit') {
            orbitAngleRef.current += 0.025; // Smooth 360° circular showcase
            targetAngle = orbitAngleRef.current;
            isEyeContactRef.current = false;
          } else if (mode === 'compass') {
            targetAngle = targetAngleRef.current;
          } else {
            // Interactive tracking mode
            if (!mouse.active) {
              isEyeContactRef.current = true;
            } else {
              // Direct eye contact when hovering over the face
              isEyeContactRef.current = dist < deadzoneRadius;
            }

            // CRITICAL FIX: ALWAYS update targetAngle when cursor moves!
            // Zero deadband on angle tracking prevents the character from ever getting stuck!
            if (dist > 1.0) {
              targetAngle = Math.atan2(dy, dx);
              targetAngleRef.current = targetAngle;
            }
          }

          // FAST & ULTRA-SMOOTH SHORTEST-PATH CIRCULAR ANGULAR LERP (~35ms response)
          // Factor 0.24 provides instant, lifelike tracking with zero perceived lag
          currentAngleRef.current = lerpAngle(currentAngleRef.current, targetAngle, 0.24);

          // Map smoothed angle to nearest frame index 0..63
          const norm = (currentAngleRef.current % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          const frameIndex = Math.round((norm / (Math.PI * 2)) * 64) % 64;

          // ZERO-GHOSTING 100% CRISP CANVAS DRAW
          // Only redraw when frame index or eye-contact state changes (massive GPU saving)
          const needsRedraw = 
            frameIndex !== lastDrawnFrameIndexRef.current || 
            isEyeContactRef.current !== lastDrawnEyeContactRef.current;

          if (needsRedraw) {
            lastDrawnFrameIndexRef.current = frameIndex;
            lastDrawnEyeContactRef.current = isEyeContactRef.current;

            // 1. Clear with exact studio background color
            ctx.fillStyle = '#eb0e09';
            ctx.fillRect(0, 0, 1280, 720);

            // 2. Draw EXACTLY ONE crisp frame at 100% opacity (no alpha blending)
            ctx.globalAlpha = 1.0;

            if (isEyeContactRef.current && centerFrameRef.current && centerFrameRef.current.complete) {
              ctx.drawImage(centerFrameRef.current, 0, 0, 1280, 720);
              lastRenderedImgRef.current = centerFrameRef.current;
            } else {
              const currentImg = framesRef.current[frameIndex];
              if (currentImg && currentImg.complete && currentImg.naturalWidth > 0) {
                ctx.drawImage(currentImg, 0, 0, 1280, 720);
                lastRenderedImgRef.current = currentImg;
              } else if (lastRenderedImgRef.current) {
                ctx.drawImage(lastRenderedImgRef.current, 0, 0, 1280, 720);
              }
            }
          }

          // Throttled Telemetry push ONLY when HUD is actively opened by user
          // Keeps React thread completely silent (0% CPU) during normal interaction
          if (showHudRef.current && time - lastTelemetryPush > 100) {
            lastTelemetryPush = time;
            const deg = Math.round((norm * 180) / Math.PI);
            let directionLabel = 'RIGHT';
            if (isEyeContactRef.current) directionLabel = 'CENTER (EYE CONTACT)';
            else if (deg >= 23 && deg < 68) directionLabel = 'DOWN-RIGHT';
            else if (deg >= 68 && deg < 113) directionLabel = 'DOWN';
            else if (deg >= 113 && deg < 158) directionLabel = 'DOWN-LEFT';
            else if (deg >= 158 && deg < 203) directionLabel = 'LEFT';
            else if (deg >= 203 && deg < 248) directionLabel = 'UP-LEFT';
            else if (deg >= 248 && deg < 293) directionLabel = 'UP';
            else if (deg >= 293 && deg < 338) directionLabel = 'UP-RIGHT';
            else directionLabel = 'RIGHT';

            setTelemetry({
              angleDeg: deg,
              direction: directionLabel,
              frameIndex,
              isEyeContact: isEyeContactRef.current,
              fps,
            });
          }

          animFrameIdRef.current = requestAnimationFrame(renderLoop);
        };

        animFrameIdRef.current = requestAnimationFrame(renderLoop);

        return () => {
          if (animFrameIdRef.current) {
            cancelAnimationFrame(animFrameIdRef.current);
          }
        };
      }, [mode]);

      // Set compass direction manually
      const setCompass = (dir) => {
        if (dir === 'CENTER') {
          isEyeContactRef.current = true;
          setMode('compass');
        } else {
          isEyeContactRef.current = false;
          targetAngleRef.current = COMPASS_ANGLES[dir];
          setMode('compass');
        }
      };

      // Projects data (Computer Engineering & Python/Django journey)
      // Space reserved so you can easily add your own projects as you build them!
      const projects = [
        {
          id: '01',
          title: 'Django Full-Stack Web App',
          category: 'PYTHON • DJANGO • SQLITE/POSTGRESQL',
          tech: 'Python 3, Django, SQLite, HTML5, Tailwind CSS',
          desc: 'A full-featured web application with user authentication, relational database models, CRUD operations, and structured MTV architecture.',
          liveUrl: '#'
        },
        {
          id: '02',
          title: 'Python Automation & Scripting',
          category: 'PYTHON • AUTOMATION • APIS',
          tech: 'Python, REST APIs, JSON Processing, Web Scraping',
          desc: 'Automated utility scripts for parsing real-world datasets, interacting with external web APIs, and automating repetitive tasks.',
          liveUrl: '#'
        },
        {
          id: '03',
          title: 'Future Project (In Progress)',
          category: 'LEARNING & BUILDING • COMING SOON',
          tech: 'Python, Django REST Framework, Web Architecture',
          desc: 'Space reserved for upcoming software engineering projects, data structures implementations, and full-stack software as my journey continues.',
          isFuture: true,
          liveUrl: '#'
        }
      ];

      return (
        <div className="relative min-h-screen bg-[#eb0e09] text-white selection:bg-white selection:text-[#eb0e09]">

          {/* FLOATING FROSTED-GLASS NAVIGATION PILL */}
          <header className="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-auto">
            <nav className="frosted-nav px-5 py-2.5 rounded-full flex items-center gap-1 sm:gap-2 shadow-2xl">
              <a 
                href="#hero" 
                className="px-3.5 py-1.5 rounded-full text-xs font-mono font-medium tracking-widest text-white/80 hover:text-white hover:bg-white/10 transition-all"
              >
                [HOME]
              </a>
              <a 
                href="#work" 
                className="px-3.5 py-1.5 rounded-full text-xs font-mono font-medium tracking-widest text-white/80 hover:text-white hover:bg-white/10 transition-all"
              >
                [PROJECTS]
              </a>
              <a 
                href="#about" 
                className="px-3.5 py-1.5 rounded-full text-xs font-mono font-medium tracking-widest text-white/80 hover:text-white hover:bg-white/10 transition-all"
              >
                [ABOUT]
              </a>
              <a 
                href="#contact" 
                className="px-3.5 py-1.5 rounded-full text-xs font-mono font-medium tracking-widest text-white/80 hover:text-white hover:bg-white/10 transition-all"
              >
                [CONTACT]
              </a>
            </nav>
          </header>

          {/* HERO SECTION */}
          <section id="hero" className="relative w-screen h-screen overflow-hidden flex flex-col justify-between">
